<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client Registry | Aurelia Fine Jewellery</title>
  <meta name="description" content="Join the Aurelia Society. Gain access to private styling slots, custom order tracking and bespoke GIA diamond listings.">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/dark.css">
  <link rel="stylesheet" href="assets/css/animations.css">
  
  <style>
    .auth-bg {
      background-image: url('assets/images/banners/gift-guide.jpg');
      background-size: cover;
      background-position: center;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .auth-glass-panel {
      background: rgba(10, 10, 10, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      width: 100%;
      max-width: 450px;
      padding: 3rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
      color: #FAFAFA;
    }

    .social-btn-container {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #ffffff;
      transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
      cursor: pointer;
      outline: none;
    }

    .social-btn:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.15);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
    }

    .social-btn.google-btn:hover {
      border-color: #4285F4;
      box-shadow: 0 6px 20px rgba(66, 133, 244, 0.35);
    }

    .social-btn.facebook-btn:hover {
      border-color: #1877F2;
      background: rgba(24, 119, 242, 0.15);
      box-shadow: 0 6px 20px rgba(24, 119, 242, 0.35);
    }

    .social-btn.apple-btn:hover {
      border-color: #ffffff;
      background: rgba(255, 255, 255, 0.2);
      box-shadow: 0 6px 20px rgba(255, 255, 255, 0.3);
    }

    .social-btn.twitter-btn:hover {
      border-color: #1DA1F2;
      background: rgba(29, 161, 242, 0.15);
      box-shadow: 0 6px 20px rgba(29, 161, 242, 0.35);
    }
  </style>
</head>
<body>

  <div class="auth-bg">
    <div class="auth-glass-panel text-center gsap-fade-up">
      
      <a href="index.html" class="brand-logo d-block mb-4 text-white" style="font-size: 2.2rem;">Aurelia</a>
      
      <h2 class="font-editorial mb-2 text-white" style="font-size: 1.8rem;">Create Vault Account</h2>
      <p class="text-white-50 mb-4" style="font-size: 0.85rem;">Join the Aurelia Society to coordinate custom orders and bespoke designs.</p>

      <form id="luxury-signup-form" onsubmit="handleSignup(event)">
        <div class="mb-3 text-start">
          <label class="form-label font-pricing text-white-50" style="font-size: 0.75rem;">CLIENT FULL NAME</label>
          <input type="text" class="form-control newsletter-input py-2 text-white" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label font-pricing text-white-50" style="font-size: 0.75rem;">EMAIL ADDRESS</label>
          <input type="email" class="form-control newsletter-input py-2 text-white" required>
        </div>
        <div class="mb-3 text-start">
          <label class="form-label font-pricing text-white-50" style="font-size: 0.75rem;">DESIRED PASSWORD</label>
          <input type="password" class="form-control newsletter-input py-2 text-white" required>
        </div>
        <div class="mb-4 text-start">
          <label class="custom-checkbox text-white-50" style="font-size: 0.8rem;">
            <input type="checkbox" required class="me-2" style="accent-color: var(--color-accent);">
            <span>I agree to Aurelia's Terms & Private Membership Policies.</span>
          </label>
        </div>

        <button type="submit" class="btn btn-luxury-solid btn-luxury w-100 py-3 mb-3">Register Vault</button>
      </form>

      <!-- Original Social Icons Section -->
      <div class="d-flex align-items-center my-4">
        <hr class="flex-grow-1 border-secondary opacity-25 m-0">
        <span class="px-3 text-white-50" style="font-size: 0.75rem; letter-spacing: 1px; text-transform: uppercase;">Or sign up with</span>
        <hr class="flex-grow-1 border-secondary opacity-25 m-0">
      </div>

      <div class="social-btn-container">
        <button type="button" class="social-btn google-btn" title="Sign up with Google" aria-label="Sign up with Google" onclick="handleSocialAuth('Google')">
          <svg width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
        </button>
        <button type="button" class="social-btn facebook-btn" title="Sign up with Facebook" aria-label="Sign up with Facebook" onclick="handleSocialAuth('Facebook')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2">
            <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
          </svg>
        </button>
        <button type="button" class="social-btn apple-btn" title="Sign up with Apple" aria-label="Sign up with Apple" onclick="handleSocialAuth('Apple')">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#FFFFFF">
            <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.09c.67-.82 1.13-1.96.99-3.09-1 .04-2.2.67-2.9 1.49-.62.72-1.17 1.88-1.02 2.99 1.12.09 2.26-.57 2.93-1.39z"/>
          </svg>
        </button>
        <button type="button" class="social-btn twitter-btn" title="Sign up with X" aria-label="Sign up with X" onclick="handleSocialAuth('X')">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="#FFFFFF">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
          </svg>
        </button>
      </div>

      <p class="mb-0 text-white-50" style="font-size: 0.85rem;">Already have an account? <a href="login.html" class="text-gold text-decoration-underline">Access Vault</a></p>

    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="assets/js/theme-toggle.js"></script>
  <script src="assets/js/animations.js"></script>

  <script>
    function handleSignup(e) {
      e.preventDefault();
      alert('Your Aurelia membership registration is complete. Redirecting you to login page...');
      window.location.href = "login.html";
    }

    function handleSocialAuth(provider) {
      alert(provider + ' registration connected. Welcome to the Aurelia Society!');
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
